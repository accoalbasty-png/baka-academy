
{% extends "base.html" %}

{% block title %}Sign In | Baka Academy{% endblock %}

{% block content %}

<div class="login-page">

    <section class="login-card">

        <div class="login-logo">
            <img
                src="{{ url_for('static', filename='logo.jpg') }}"
                alt="Baka Academy Logo"
            >
        </div>

        <p class="login-school-name">BAKA ACADEMY</p>

        <h2>Welcome Back</h2>

        <p class="login-description">
            Sign in to access your school management portal.
        </p>

        <form method="post">

            <label for="username">Username</label>
            <input
                id="username"
                type="text"
                name="username"
                placeholder="Enter your username"
                autocomplete="username"
                required
            >

            <label for="password">Password</label>
            <input
                id="password"
                type="password"
                name="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
            >

            <button type="submit" class="login-button">
                Sign In
            </button>

        </form>

        <p class="login-footer">
            Authorized school personnel only.
        </p>

    </section>

</div>

{% endblock %}
